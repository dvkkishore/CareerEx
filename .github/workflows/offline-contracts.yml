name: Offline application contracts
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Python source syntax
        run: python -m compileall -q app.py career_field.py
      - name: Run offline auth and dataset contracts
        run: python -m unittest discover -s tests -v
